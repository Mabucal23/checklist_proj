version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: checklist_db
    environment:
      POSTGRES_USER: checklist_user
      POSTGRES_PASSWORD: checklist_password
      POSTGRES_DB: checklist_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n_server
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=checklist_db
      - DB_POSTGRESDB_USER=checklist_user
      - DB_POSTGRESDB_PASSWORD=checklist_password
    depends_on:
      - postgres
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data: