<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n8n Checklist System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        .checklist-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #0070f3; /* Vercel Blue */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #005bb5;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: #f9f9f9;
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #eee;
        }
        .completed {
            text-decoration: line-through;
            color: #888;
        }
    </style>
</head>
<body>

<div class="checklist-container">
    <h2>My Checklist</h2>
    
    <form id="taskForm">
        <input type="text" id="taskInput" placeholder="Add a new task..." required>
        <button type="submit">Add Task</button>
    </form>

    <ul id="taskList">
        <!-- Tasks will be injected here by JavaScript -->
    </ul>
</div>

<script>
    // Replace this with your actual n8n webhook URL
    const N8N_WEBHOOK_URL = 'https://ndb1.api.fpctools.com/webhook/add-task';

    const taskForm = document.getElementById('taskForm');
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');

    // Function to send a new task to n8n
    taskForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const taskName = taskInput.value;
        taskInput.value = ''; // Clear input

        // Optimistically add to UI
        addTaskToUI(taskName, false);

        try {
            // Send to n8n Webhook
            const response = await fetch(N8N_WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    action: 'create',
                    task_name: taskName,
                    status: 'pending'
                })
            });

            if (!response.ok) {
                console.error('Failed to save to n8n database');
            }
        } catch (error) {
            console.error('Error connecting to n8n:', error);
        }
    });

    // Helper function to update the DOM
    function addTaskToUI(taskName, isCompleted) {
        const li = document.createElement('li');
        li.textContent = taskName;
        
        if (isCompleted) {
            li.classList.add('completed');
        }

        const completeBtn = document.createElement('button');
        completeBtn.textContent = 'Done';
        completeBtn.style.padding = '5px 10px';
        completeBtn.style.fontSize = '12px';
        
        completeBtn.onclick = () => {
            li.classList.add('completed');
            completeBtn.remove();
            // You can add another fetch() here to send an "update" action to n8n
        };

        li.appendChild(completeBtn);
        taskList.appendChild(li);
    }

    // Optional: Add a function here to fetch existing tasks from Postgres via n8n on page load
</script>

</body>
</html>
